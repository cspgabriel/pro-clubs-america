name: iOS Release
on:
  workflow_dispatch:
    inputs:
      build_number:
        description: Numero do build
        required: true
        default: "1"
      marketing_version:
        description: Versao publica
        required: true
        default: "1.0.0"
      signed:
        description: Assinar e exportar IPA
        type: boolean
        default: false
      upload:
        description: Enviar IPA ao App Store Connect
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      IOS_FOLDER: ios
      IOS_TARGET: Pro Clubs America
      BUNDLE_ID: com.proclubsamerica.app
      TEAM_ID: BUK3X7JL65
      BUILD_NUMBER: ${{ inputs.build_number }}
      MARKETING_VERSION: ${{ inputs.marketing_version }}
      SIGNED: ${{ inputs.signed }}
    steps:
      - uses: actions/checkout@v4
      - name: Select App Store compatible Xcode
        run: |
          set -euo pipefail
          test -d /Applications/Xcode_26.3.app
          sudo xcode-select --switch /Applications/Xcode_26.3.app
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Validate requested signing and upload
        env:
          UPLOAD: ${{ inputs.upload }}
        run: |
          if [[ "$UPLOAD" == true && "$SIGNED" != true ]]; then
            echo 'Upload requires a signed archive'; exit 1
          fi
      - name: Install dependencies and prepare signing
        env:
          CERT_P12: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/ios-release.sh prepare
      - name: Compile for physical iOS devices
        run: bash scripts/ios-release.sh compile
      - name: Simulator launch and screenshots
        if: ${{ !inputs.signed }}
        run: bash scripts/ios-release.sh simulator
      - name: Archive and export signed IPA
        if: ${{ inputs.signed }}
        run: bash scripts/ios-release.sh archive
      - name: Upload to App Store Connect
        if: ${{ inputs.signed && inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_API_KEY_P8_BASE64 }}
        run: bash scripts/ios-release.sh upload
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-pro-clubs-america-${{ inputs.build_number }}
          path: ${{ runner.temp }}/ios-output
          if-no-files-found: ignore
          retention-days: 14
      - name: Clean up signing files
        if: ${{ always() && inputs.signed }}
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist"
